[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-ocr"
version = "0.1.0"
description = "Wrapper local para GLM-OCR"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.0.0",
    "fastapi>=0.110.0",
    "Pillow",
    "python-multipart>=0.0.9",
    "tokenizers>=0.22.0",
    "torch>=2.6.0",
    "torchvision>=0.25.0",
    "transformers>=5.2.0,<6.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
glm-ocr = "glm_ocr.cli:main"

[tool.setuptools]
packages = ["glm_ocr"]
