[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-ocr2"
version = "0.1.0"
description = "Wrapper local para DeepSeek OCR 2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "addict",
    "easydict",
    "einops",
    "fastapi>=0.110.0",
    "Pillow",
    "python-multipart>=0.0.9",
    "tokenizers==0.20.3",
    "torch==2.6.0",
    "transformers==4.46.3",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
deepseek-ocr2 = "deepseek_ocr2.cli:main"

[tool.setuptools]
packages = ["deepseek_ocr2"]
