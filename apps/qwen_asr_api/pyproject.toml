[project]
name = "qwen-asr-server"
version = "0.1.0"
description = "Standalone FastAPI service for Qwen ASR."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "qwen-asr[vllm]",
    "soundfile>=0.12.1",
    "uvicorn[standard]>=0.30.0",
]
